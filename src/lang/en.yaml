revolutionary-piratecrews:
  settings:
    watches:
      name: Watch System
      hint: |
        The watch system used by your pirates. Define the name and length of
        each of the day’s watches.
      error: |
        Watch configuration must be an object that adheres to this interface:
        `{ watches: Array<{ name: string, duration: number }>, offset: number }`.
    officers:
      name: Officers
      hint: |
        What officers should new crews have to choose from?
      error: |
        Officer configuration must be an object that adheres to this interface:
        `{ [key: string]: { title: string, desc: string, sans: string, shares: number } }`
    provisions:
      name: Provisions
      hint: |
        What sort of provisions do you want to track? `unit` is how you want to
        measure that provision; `units` is the plural form. `consumption` is
        how much each member of the crew consumes each day.
      error: |
        Provision configuration must be an object that adheres to this interface:
        `{ [key: string]: { label: string, unit: string, units: string, consumption: number } }`
  provisions:
    food:
      label: Vittles
      unit: ration
      units: rations
    water:
      label: Fresh water
      unit: ration
      units: rations
    rum:
      label: Rum
      unit: ration
      units: rations
  watches:
    default:
      first: First Watch
      middle: Middle Watch
      morning: Morning Watch
      forenoon: Forenoon Watch
      afternoon: Afternoon Watch
      dog1: First Dog Watch
      dog2: Second Dog Watch
  watch-crews:
    starboard: Starboard Crew
    larboard: Larboard Crew
  officers:
    captain:
      title: Captain
      desc: |
        Under normal circumstances, the captain is co-equal with the
        quartermaster, but in action his word is law. The captain is
        responsible for hunting prey and leading attacks. It’s the captain’s
        name that the crew will come to be known and feared by, but that legend
        is an asset created and owned collectively by the crew, not the captain
        himself.
      sans: |
        A ship isn’t ready to sail without a captain.
    quartermaster:
      title: Quartermaster
      desc: |
        Under normal circumstances, the quartermaster is co-equal with the
        captain. He is elected by the crew to represent their interests and
        check the captain’s power. He’s in charge of the company’s finances,
        assets, and resources, for enforcing the articles of agreement, and
        paying out shares. He runs auctions for those items that are not easily
        divided and is responsible for discipline and mediating disputes among
        the crew.
      sans: |
        A ship isn’t ready to sail without a quartermaster.
    master:
      title: Sailing Master
      desc: |
        The sailing master — often shortened to just “master” — is one of the
        leading officers on a pirate ship, leading one of the watch crews and
        even taking command when the captain or quartermaster are unavailable.
        He takes primary responsibility for actually sailing the ship,
        including navigation, maintaining logs on the ship’s position, speed,
        ocean depth, winds, etc., as well as maintaining the sails, rigging,
        and general seaworthiness of the vessel.
      sans: |
        A ship isn’t ready to sail without a sailing master.
    bosun:
      title: Bosun
      desc: |
        The boatswain or bosun is a minor officer responsible for the rigging
        and cordage aboard the vessel. They oversee shift changes at the end of
        each watch. Discipline often falls to the bosun, making him the most
        feared man on the crew. The bosun’s badge of office is a silver whistle
        worn around the neck. He reports to the quartermaster.
      sans: |
        On a ship without a bosun the quartermaster assumes these duties.
    gunner:
      title: Master Gunner
      desc: |
        The master gunner is a petty officer responsible for the cannons aboard
        the ship. Gunners required extensive education, including arithmetic,
        geometry, the names of every piece of ordnance and their parts, and how
        to detect the flaws and qualities of a gun. The master gunner is the
        only member of the crew besides the captain and quartermaster entrusted
        with a key to the powder magazine.
      sans: |
        On a ship without a master gunner, the quartermaster assumes these
        duties. Such a ship may struggle to keep its cannons in proper fighting
        condition or bring them to bear with full effectiveness in a fight.
    carpenter:
      title: Master Carpenter
      desc: |
        The master carpenter is responsible for repairs to the hull, masts, and
        other wooden parts of the ship, including keeping leaks to an
        acceptable minimum. During battle, they are usually below deck to plug
        holes from cannon balls. The master carpenter is responsible for ship
        upgrades and modifications and directs careening.
      sans: |
        A crew without a carpenter will be challenged to repair damage to
        their ship.
    surgeon:
      title: Surgeon
      desc: |
        Doctors at this time follow a theory of medicine based on miasmas and
        humors, but few pirate ship’s surgeons have any formal medical
        training. They serve as barber, dentist, and field medic, and often
        receive higher pay and better accommodations for their skills. They’re
        responsible for the maintenance of the tools of their trade and are
        expected to keep their medicine chest well-stocked.
      sans: |
        Crew members in need of medical aid on a ship without a surgeon will
        have to make do with what the cook or the carpenter can provide.
  articles:
    shares:
      equal: |
        To each Member of this Company shall be paid an equal share of
        each Prize.
      initial: |
        To the {officers} shall be paid {amount} Shares of each Prize
      following: |
        to the {officers}, {amount}
      final: |
        and to each other member of this Company, one Share.
      auction: |
        Items of unique value which cannot be properly divided shall be
        auctioned to the members of the Company by the Quartermaster, or
        awarded as the Captain and the Majority of the Company shall see fit.
      conj: and
      p05: one twentieth
      p10: one tenth
      p15: three twentieths
      p20: one fifth
      p25: one quarter
      p30: three tenths
      p35: one third
      p40: two fifths
      p45: nine twentieths
      p50: one half
      p55: eleven twentieths
      p60: three fifths
      p65: two thirds
      p70: seven tenths
      p75: three quarters
      p80: four fifths
      p85: seventeen twentieths
      p90: nine tenths
      p95: nineteen twentieths
      1: one
      2: two
      3: three
      4: four
      5: five
      6: six
      7: seven
      8: eight
      9: nine
      10: ten
      11: eleven
      12: twelve
      13: thirteen
      14: fourteen
      15: fifteen
      16: sixteen
      17: seventeen
      18: eighteen
      19: nineteen
      20: twenty
    common:
      equality: |
        Every Member of this Company Shall have a Vote in matters of Moment, as
        well as equal title to fresh provisions or strong liquors, at any time
        seized, and may use them at pleasure, unless a scarcity makes it
        necessary for the good of all to vote a retrenchment.
      theft: |
        Any Member of this Company who shall keep any Secret from the Company,
        or steal any Thing in the Company, or game, to the Value of a Piece of
        Eight, shall be marooned with one Bottle of Powder, one Bottle of
        Water, one small Arm, and Shot.
      readiness: |
        Every Member of this Company shall keep his Piece, Pistols, Cutlasses,
        and other Arms clean and fit for Service. He that shall be guilty of
        Drunkenness in time of Engagement shall suffer Moses’ Law (that is, 40
        Stripes lacking one) on the bare Back.
      injury: |
        Any Member of this Company that shall lose a Joint in time of an
        Engagement shall have 400 Pieces of Eight; if a Limb, 800; if an Eye or
        Finger, 100.
      fire: |
        Anyone that shall snap his Arms, or smoke Tobacco in the Hold, without
        a Cap to his Pipe, or carry a Candle lighted without a Lantern, shall
        suffer Moses’ Law (that is, 40 Stripes lacking one) on the bare Back.
      dueling: |
        No one shall strike another while Aboard the Vessel. Such quarrels as
        must find Satisfaction by Sword or Pistol shall be settled on Shore at
        such time as Fortune allows.
      gambling: |
        Any Member of this Company who shall play at Cards or Dice for Money 
        hall suffer such punishment as the Captain and the Majority of the
        Company shall deem fit.
      cowardice: |
        Any Member of this Company that shall be found Guilty of Cowardice, or
        desert the Ship or their Quarters in Battle, shall suffer such
        punishment as the Captain and the Majority of the Company shall
        deem fit.



      
        
   

